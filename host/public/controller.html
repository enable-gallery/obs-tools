<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Controller — obs-tools host</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #9147ff;
    --green: #3fb950;
    --red: #f85149;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }

  .top-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; max-width: 720px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

  a.nav-link { color: var(--accent); text-decoration: none; font-size: 13px; }
  a.nav-link:hover { text-decoration: underline; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    max-width: 720px;
  }

  .status-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: #1f232c;
    border: 1px solid var(--border);
    font-size: 13px;
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .dot.on { background: var(--green); }

  .scene-label { font-size: 13px; color: var(--muted); }
  .scene-label strong { color: var(--text); }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #1f232c;
    color: var(--text);
    padding: 10px 14px;
  }

  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #pauseBtn.paused { background: var(--red); border-color: var(--red); }

  .scene-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
  }

  .scene-grid button { padding: 16px 14px; font-size: 14px; text-align: left; }
  .scene-grid:empty::after { content: "No OBS scenes yet — check the OBS connection on the setup page."; color: var(--muted); font-size: 13px; }

  #feed { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; }
  #feed li { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  #feed li:last-child { border-bottom: none; }
  #feed .time { color: var(--muted); margin-right: 8px; }
  #feed .status-ok { color: var(--green); }
  #feed .status-bad { color: var(--red); }
  #feed:empty::after { content: "No redemptions yet this session."; color: var(--muted); font-size: 13px; }

  .module-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .module-row:last-child { border-bottom: none; }
  .module-row .module-id { flex: 1; }
  .module-row .module-status { font-size: 12px; color: var(--muted); min-width: 160px; }
</style>
</head>
<body>
  <div class="top-row">
    <h1>obs-tools controller</h1>
    <a class="nav-link" href="/setup">Setup &rarr;</a>
  </div>

  <div class="panel">
    <div class="status-row">
      <span class="pill"><span id="obsDot" class="dot"></span>OBS</span>
      <span class="pill"><span id="twitchDot" class="dot"></span>Twitch</span>
      <span class="pill"><span id="discordDot" class="dot"></span>Discord</span>
      <span class="scene-label">Current scene: <strong id="currentScene">&mdash;</strong></span>
      <button id="pauseBtn">Pause redemptions</button>
    </div>
  </div>

  <div class="panel">
    <h2>Scenes</h2>
    <div class="scene-grid" id="sceneGrid"></div>
  </div>

  <div class="panel">
    <h2>Modules</h2>
    <div id="moduleList"></div>
  </div>

  <div class="panel">
    <h2>Live feed</h2>
    <ul id="feed"></ul>
  </div>

<script>
  const obsDot = document.getElementById("obsDot");
  const twitchDot = document.getElementById("twitchDot");
  const discordDot = document.getElementById("discordDot");
  const currentScene = document.getElementById("currentScene");
  const pauseBtn = document.getElementById("pauseBtn");
  const sceneGrid = document.getElementById("sceneGrid");
  const moduleList = document.getElementById("moduleList");
  const feed = document.getElementById("feed");

  let paused = false;
  let obsScenes = [];
  let moduleIds = [];
  const moduleStatusEls = new Map();

  function renderScenes() {
    sceneGrid.innerHTML = "";
    for (const sceneName of obsScenes) {
      const btn = document.createElement("button");
      btn.textContent = sceneName;
      if (sceneName === currentScene.textContent) btn.classList.add("active");
      btn.addEventListener("click", () => send({ type: "switchScene", sceneName }));
      sceneGrid.appendChild(btn);
    }
  }

  function renderModules() {
    moduleList.innerHTML = "";
    moduleStatusEls.clear();
    for (const moduleId of moduleIds) {
      const row = document.createElement("div");
      row.className = "module-row";

      const idSpan = document.createElement("span");
      idSpan.className = "module-id";
      idSpan.textContent = moduleId;

      const statusSpan = document.createElement("span");
      statusSpan.className = "module-status";
      moduleStatusEls.set(moduleId, statusSpan);

      const testBtn = document.createElement("button");
      testBtn.textContent = "Send test";
      testBtn.addEventListener("click", () => {
        testBtn.disabled = true;
        statusSpan.style.color = "";
        statusSpan.textContent = "Sending...";
        send({ type: "runModuleTest", moduleId });
      });

      row.appendChild(idSpan);
      row.appendChild(statusSpan);
      row.appendChild(testBtn);
      moduleList.appendChild(row);
    }
  }

  function applyStatus(status) {
    obsDot.classList.toggle("on", status.obsConnected);
    twitchDot.classList.toggle("on", status.twitchConnected);
    discordDot.classList.toggle("on", status.discordConnected);
    currentScene.textContent = status.currentScene || "—";
    paused = Boolean(status.chatPaused);
    pauseBtn.textContent = paused ? "Resume redemptions" : "Pause redemptions";
    pauseBtn.classList.toggle("paused", paused);
    renderScenes();
  }

  function addFeedItem(entry) {
    const li = document.createElement("li");
    const time = new Date(entry.timestamp).toLocaleTimeString();
    const statusClass = entry.status === "FULFILLED" ? "status-ok" : "status-bad";
    li.innerHTML = `<span class="time">${time}</span><strong>${entry.userName}</strong> redeemed "${entry.rewardTitle}" → ${entry.detail} <span class="${statusClass}">${entry.status}</span>`;
    feed.prepend(li);
    while (feed.children.length > 50) feed.removeChild(feed.lastChild);
  }

  let ws;
  function connect() {
    ws = new WebSocket(`ws://${location.host}`);

    ws.addEventListener("message", (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "init") {
        obsScenes = msg.obsScenes || [];
        moduleIds = msg.moduleIds || [];
        renderModules();
        applyStatus(msg.status);
      } else if (msg.type === "status") {
        applyStatus(msg.status);
      } else if (msg.type === "obsScenes") {
        obsScenes = msg.scenes || [];
        renderScenes();
      } else if (msg.type === "feedEntry") {
        addFeedItem(msg.entry);
      } else if (msg.type === "moduleTestResult") {
        const statusSpan = moduleStatusEls.get(msg.moduleId);
        if (statusSpan) {
          statusSpan.textContent = msg.ok ? "✅ Sent" : `❌ ${msg.message}`;
          statusSpan.style.color = msg.ok ? "var(--green)" : "var(--red)";
          const row = statusSpan.closest(".module-row");
          const btn = row && row.querySelector("button");
          if (btn) btn.disabled = false;
        }
      }
    });

    ws.addEventListener("close", () => setTimeout(connect, 2000));
  }

  function send(message) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(message));
  }

  pauseBtn.addEventListener("click", () => {
    send({ type: "setPaused", paused: !paused });
  });

  connect();
</script>
</body>
</html>
